physics:
  gravity: -900       # pymunk units/s² (pixels)
  dt: 0.016666        # 1/60 s per env step
  substeps: 4         # physics substeps per env step
  ground_y: 50        # ground segment y position (pixels)

reward_weights:
  forward_velocity: 1.0     # reward for moving right (m/s)
  energy_penalty: 0.001     # penalise sum(action²)
  upright_penalty: 0.5      # penalise abs(torso_angle)
  alive_bonus: 0.05         # per-step bonus for staying alive
  fall_penalty: 1.0         # one-off penalty on fall → done

max_steps: 1000             # max env steps per episode
spawn_x: 300                # creature spawn x (pixels)
spawn_height_above_ground: 250  # creature spawn height above ground (pixels)

training:
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  n_steps: 8192         # rollout length before each PPO update
  n_epochs: 15          # PPO epochs per update
  minibatch_size: 1024
  entropy_coef: 0.001
  value_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 1_000_000
  eval_every_steps: 50_000   # steps between evaluation renders
  eval_episodes: 3           # episodes to average for eval
  checkpoint_dir: checkpoints

evolution:
  population_size: 16
  n_generations: 20
  per_genome_timesteps: 200_000  # PPO steps per genome per generation
  elitism: 2                     # top N genomes kept unchanged
  mutation_rate: 0.4
  crossover_rate: 0.3
  tournament_k: 3               # tournament selection size
  seed_genomes:                  # preset files to seed gen-0 population
    - creature/presets/biped.json
    - creature/presets/quadruped.json
    - creature/presets/worm.json
    - creature/presets/tripod.json
